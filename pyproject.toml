[project]
name = "scantriage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6.2",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pyrefly>=1.1.1",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
    "safety>=3.8.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["scantriage"]
